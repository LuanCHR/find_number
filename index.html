<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ache o 67</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap">
  <!-- for marcellinha-->
<style>
/* Layout: one centered phone-width column. Header with progress dots, a 5x7 board of chunky keys; after three finds the board is replaced by two short screens. */
:root {
  color-scheme: light;
  --bg: #FFD94A;
  --ink: #1A1630;
  --muted: #5B4E14;
  --tile: #FFF4BE;
  --tile-edge: #D9A914;
  --accent: #E5186A;
  --accent-edge: #A50F4E;
  --accent-ink: #FFFFFF;
  --display: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17132B;
    --ink: #FFF1B0;
    --muted: #B7AEE6;
    --tile: #2A2450;
    --tile-edge: #0C0919;
    --accent: #FF5C93;
    --accent-edge: #B02B5F;
    --accent-ink: #1A1630;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17132B;
  --ink: #FFF1B0;
  --muted: #B7AEE6;
  --tile: #2A2450;
  --tile-edge: #0C0919;
  --accent: #FF5C93;
  --accent-edge: #B02B5F;
  --accent-ink: #1A1630;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.app {
  width: 100%;
  max-width: 440px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  padding-top: 8px;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(34px, 10vw, 48px);
  line-height: 1;
  letter-spacing: -0.02em;
}
h1 .n { color: var(--accent); }
.progress { display: flex; gap: 8px; padding-bottom: 6px; }
.dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  transition: background-color .2s;
}
.dot.on { background: var(--accent); border-color: var(--accent); }

.status {
  margin: 0;
  min-height: 1.4em;
  font-weight: 600;
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding-bottom: 4px;
}
.grid.locked { pointer-events: none; }
.key {
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: var(--tile);
  color: var(--ink);
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(20px, 6.2vw, 28px);
  font-variant-numeric: tabular-nums;
  box-shadow: 0 4px 0 var(--tile-edge);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tile-edge); }
.key:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.key.hit { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-edge); animation: pop .35s ease-out; }
.key.miss { opacity: .45; animation: shake .3s; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.final { display: flex; flex-direction: column; gap: 20px; padding-top: 16px; }
.kicker {
  margin: 0;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.final h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(44px, 14vw, 64px);
  line-height: 1.02;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.next {
  align-self: flex-start;
  font-family: var(--display);
  font-weight: 800;
  font-size: 22px;
  padding: 16px 34px;
  border: 0;
  border-radius: 14px;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 5px 0 var(--accent-edge);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.next:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-edge); }
.next:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.code { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 12px; }
.hint { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .key.hit, .key.miss { animation: none; }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Ache o <span class="n">67</span></h1>
    <div class="progress" id="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </header>

  <p id="status" class="status" aria-live="polite"></p>
  <div id="grid" class="grid" role="group" aria-label="Números"></div>

  <section id="final" class="final" hidden>
    <p class="kicker">Três de três</p>
    <h2>BOBOCA 😝😝😝😝😝</h2>
    <button type="button" class="next" id="next">Próximo</button>
  </section>

    while (nums.length < size) {
      var n = Math.random() < 0.35 ? DECOYS[rand(DECOYS.length)] : 10 + rand(90);
      if (n !== 67) nums.push(n);
    }
    nums[rand(size)] = 67;
    grid.innerHTML = '';
    nums.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'key';
      b.textContent = n;
      b.dataset.n = n;
      grid.appendChild(b);
    });
  }

  function setStatus() {
    var left = TOTAL - found;
    if (found === 0) statusEl.textContent = 'Toque no 67. Ache ' + TOTAL + ' vezes.';
    else statusEl.textContent = 'Achou. ' + (left === 1 ? 'Falta 1.' : 'Faltam ' + left + '.');
    dots.forEach(function (d, i) { d.classList.toggle('on', i < found); });
  }

  grid.addEventListener('click', function (e) {
    var key = e.target.closest('.key');
    if (!key || grid.classList.contains('locked')) return;
    if (key.dataset.n === '67') {
      found++;
      key.classList.add('hit');
      grid.classList.add('locked');
      setStatus();
      setTimeout(function () {
        grid.classList.remove('locked');
        if (found < TOTAL) buildRound(); else showFinal();
      }, 700);
    } else {
      key.classList.remove('miss');
      void key.offsetWidth;
      key.classList.add('miss');
    }
  });

  function showFinal() {
    grid.hidden = true;
    statusEl.hidden = true;
    $('final').hidden = false;
  }

  $('next').addEventListener('click', function () {
    $('final').hidden = true;
    $('done').hidden = false;
  });

  buildRound();
  setStatus();
})();
</script>
</body>
</html>
